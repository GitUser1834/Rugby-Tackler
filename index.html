</head>

<script>
let results = JSON.parse(localStorage.getItem("results")||"[]");
const houses = ["Kimberly", "Thuduc", "Barlow", "Bunuru", "Lyon", "Hannan", "Normandy", "Trinity", "Carden", "O'Reilly"];

let startTime, interval, running=false;

function start(){
    if(running) return;
    running=true;
    startTime=Date.now();
    interval=setInterval(()=>{
        let t=(Date.now()-startTime)/1000;
        document.getElementById("timer").innerText=t.toFixed(2);
    },10);
}

function stop(){
    running=false;
    clearInterval(interval);
}

function reset(){
    running=false;
    clearInterval(interval);
    document.getElementById("timer").innerText="0.00";
}

function useTime(){
    document.getElementById("manual").value = document.getElementById("timer").innerText;
}

function add(){
    let name=document.getElementById("name").value;
    let year=document.getElementById("year").value;
    let gender=document.getElementById("gender").value;
    let house=document.getElementById("house").value;
    let time=parseFloat(document.getElementById("manual").value);

    if(!name || !time || !house || !year) {
        alert("Please fill in all fields (Name, Year, House, and Time).");
        return;
    }

    results.push({id:Date.now(),name,year,gender,house,time});
    save();
    render();
    reset();
    document.getElementById("name").value = "";
    document.getElementById("manual").value = "";
}

function save(){
    localStorage.setItem("results",JSON.stringify(results));
}

function exportCSV(){
    let csv="Name,Year,Gender,House,Time\n";
    results.forEach(r=>{
        csv+=`"${r.name}",${r.year},${r.gender},"${r.house}",${r.time}\n`;
    });

    let blob=new Blob([csv],{type:"text/csv"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="results.csv";
    a.click();
}

function getBoard(filter){
    let list=results.filter(filter).sort((a,b)=>a.time-b.time);
    if(!list.length) return [];

    let lead=list[0].time;

    return list.map((r,i)=>({
        ...r,
        rank:i+1,
        gap:i===0?"Leader":"+"+(r.time-lead).toFixed(2)
    }));
}

function render(){
    let boardsHTML="";
    let navHTML="";
    let boards=[];

    // Overall Leaderboards
    boards.push({title:"Male Overall", data:getBoard(r=>r.gender==="Male")});
    boards.push({title:"Female Overall", data:getBoard(r=>r.gender==="Female")});

    // House Leaderboards
    houses.forEach(h => {
        boards.push({title:`House: ${h}`, data:getBoard(r=>r.house===h)});
    });

    // Year Group Leaderboards
    for(let y=7;y<=12;y++){
        boards.push({title:`Year ${y} Male`, data:getBoard(r=>r.year==y && r.gender==="Male")});
        boards.push({title:`Year ${y} Female`, data:getBoard(r=>r.year==y && r.gender==="Female")});
    }

    boards.forEach((b,i)=>{
        navHTML+=`<button onclick="show(${i})">${b.title}</button>`;

        let table="<table><tr><th>Rank</th><th>Name</th><th>House</th><th>Time</th><th>Gap</th><th>Action</th></tr>";
        b.data.forEach(r=>{
            table+=`
            <tr>
                <td>${r.rank}</td>
                <td>${r.name}</td>
                <td>${r.house}</td>
                <td>${r.time.toFixed(2)}s</td>
                <td>${r.gap}</td>
                <td><button class="delete-btn" onclick="del(${r.id})">X</button></td>
            </tr>`;
        });
        table+="</table>";

        boardsHTML+=`<div class="board ${i===0?"active":""}" id="b${i}">
        <h2>${b.title}</h2>${table}</div>`;
    });

    document.getElementById("nav").innerHTML=navHTML;
    document.getElementById("boards").innerHTML=boardsHTML;
}

function show(i){
    document.querySelectorAll(".board").forEach(b=>b.classList.remove("active"));
    document.getElementById("b"+i).classList.add("active");
}

function del(id){
    results=results.filter(r=>r.id!==id);
    save();
    render();
}

render();
</script>
